    <!-- Fonts loaded via @fontsource packages for Russia accessibility -->
    <!-- Global error protection: prevent blocked external scripts from crashing the app -->
    <script>
      // Catch errors from blocked external scripts (analytics, CDN, etc.)
      window.addEventListener('error', function(e) {
        // If error is from an external script that failed to load, suppress it
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK' || e.target.tagName === 'IMG')) {
          e.preventDefault();
          e.stopPropagation();
          console.warn('[Blocked resource]', e.target.src || e.target.href);
          return false;
        }
      }, true);
      // Catch unhandled promise rejections from blocked fetch calls
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          String(e.reason).includes('Failed to fetch') ||
          String(e.reason).includes('NetworkError') ||
          String(e.reason).includes('net::ERR') ||
          String(e.reason).includes('Load failed')
        )) {
          e.preventDefault();
          console.warn('[Network error suppressed]', e.reason);
          return false;
        }
      });
    </script>
