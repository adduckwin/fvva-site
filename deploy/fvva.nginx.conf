map "$status:$uri" $fvva_cache_control {
    default "no-cache";
    "~^(?:200|206|304):/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css)$" "public, max-age=31536000, immutable";
    ~*^(?:200|206|304):/.+\.(?:jpe?g|png|svg|ico|webp|woff2)$ "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name fvva.ru www.fvva.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fvva/acme;
        try_files $uri =404;
    }
    location / { return 301 https://fvva.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.fvva.ru;
    ssl_certificate /etc/letsencrypt/live/fvva.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fvva.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://fvva.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fvva.ru;
    ssl_certificate /etc/letsencrypt/live/fvva.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fvva.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/fvva/releases/RELEASE_ID;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    add_header Cache-Control $fvva_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fvva/acme;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /404 { return 404; }
    location = / { try_files /index.html =404; }
    location = /index { return 301 https://fvva.ru/$is_args$args; }
    location = /index.html { return 301 https://fvva.ru/$is_args$args; }
    location ~ ^/(.+)\.html$ {
        if (!-f $request_filename) { return 404; }
        return 301 https://fvva.ru/$1$is_args$args;
    }
    location ~ ^/(.+)/$ {
        if (!-f $document_root/$1.html) { return 404; }
        return 301 https://fvva.ru/$1$is_args$args;
    }

    location /assets/ { try_files $uri =404; }
    location ~* \.(?:pdf|jpe?g|png|svg|ico|webp|woff2|xml|txt)$ {
        try_files $uri =404;
    }
    location / { try_files $uri.html =404; }
}
